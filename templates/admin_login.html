{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harpioz — Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}?v=2">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 4 2 10l10 6 10-6z"/><path d="M6 12.5V18c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5"/></svg></span>
      <span class="logo-text" style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;">Harp<span style="color:var(--accent);">ioz</span></span>
    </div>
    <div class="card">
      <h2 style="font-size:18px;margin-bottom:5px;">Admin sign in</h2>
      <p style="color:var(--text-faint);font-size:13px;margin-bottom:22px;">Harpioz class management</p>
      {% if error %}<p class="error-text" style="margin-bottom:14px;">{{ error }}</p>{% endif %}
      <form method="post">{% csrf_token %}
        <div class="field"><label>Username</label><input type="text" name="username" autofocus placeholder="admin"></div>
        <div class="field"><label>Password</label><input type="password" name="password" placeholder="••••••••"></div>
        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
