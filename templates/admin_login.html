{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Harpioz — Admin Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}?v=5">
</head>
<body>
<div class="gradient-bar"></div>
<div class="login-page">

  <div class="login-hero">
    <div style="display:inline-flex;align-items:center;gap:8px;margin-bottom:16px;">
      <span style="width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#f5a623,#f06292);display:inline-flex;align-items:center;justify-content:center;">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;"><path d="M22 10L12 4 2 10l10 6 10-6z"/><path d="M6 12.5V18c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5"/></svg>
      </span>
      <span style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;">Harp<span style="color:#f5a623;">ioz</span></span>
    </div>
    <h1 style="font-size:22px;margin-bottom:6px;">Admin sign in</h1>
    <p style="color:#9898a8;font-size:13px;">Manage your live education classes</p>
  </div>

  <div class="login-body">
    <div class="card">
      {% if error %}
        <div style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px;color:#ef4444;">{{ error }}</div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="field">
          <label>Username</label>
          <input type="text" name="username" placeholder="admin" autofocus required>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:4px;">Sign in to Harpioz</button>
      </form>
    </div>
  </div>

</div>
<div class="gradient-footer" style="margin-top:0;">
  <span style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;">Harp<span style="color:#f5a623;">ioz</span></span>
  <span>Private education platform</span>
  <span>© 2026 Harpioz</span>
</div>
</body>
</html>
